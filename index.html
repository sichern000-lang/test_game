<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMG F1 Racing</title>
<style>
:root{--teal:#00d2be;--ink:#0b1216;--panel:rgba(8,16,20,.82);--line:#1f3a3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05090c;color:#fff;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at center,rgba(5,12,16,.35),rgba(5,12,16,.8));z-index:10;padding:20px;text-align:center}
.screen.on{display:flex}
h1{font-size:clamp(34px,6vw,76px);font-weight:900;letter-spacing:2px;font-style:italic;text-shadow:0 4px 0 #000}
h1 span{color:var(--teal)}
h2{font-size:clamp(22px,3.2vw,38px);font-weight:800;text-shadow:0 3px 0 #000}
h2 em{font-style:normal;color:var(--teal)}
.sub{opacity:.85;font-size:clamp(14px,1.6vw,20px)}
button{font-family:inherit;cursor:pointer;color:#fff}
.big{background:var(--teal);color:#001a17;border:4px solid #00403a;border-radius:16px;padding:14px 46px;font-size:24px;font-weight:900;box-shadow:0 6px 0 #00403a;transition:transform .08s}
.big:hover{transform:translateY(-2px)}.big:active{transform:translateY(4px);box-shadow:0 2px 0 #00403a}
.ghost{background:transparent;border:2px solid #fff6;border-radius:12px;padding:8px 22px;font-size:16px}
.ghost:hover{border-color:var(--teal);color:var(--teal)}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:1100px}
.card{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:18px 20px;min-width:200px;max-width:240px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.12s}
.card:hover:not(:disabled){border-color:var(--teal);transform:translateY(-4px)}
.card.sel{border-color:var(--teal);box-shadow:0 0 0 3px #00d2be55,0 0 24px #00d2be66}
.card:disabled{opacity:.35;cursor:not-allowed}
.card b{font-size:21px}.card small{opacity:.75;font-size:13px;line-height:1.4}
.card .icon{font-size:42px}
.helmet{width:74px;height:74px;border-radius:50% 50% 46% 46%;position:relative;border:3px solid #000;overflow:hidden}
.helmet i{position:absolute;left:-10%;right:-10%;top:30%;height:16%}
.helmet u{position:absolute;right:-6px;top:38%;width:56%;height:34%;background:#111;border-radius:50% 0 0 50%;border:2px solid #000}
.num{font-size:34px;font-weight:900;font-style:italic;color:var(--teal)}
.stat{display:flex;gap:6px;align-items:center;font-size:12px;width:100%;justify-content:space-between}
.stat span.bar{display:inline-flex;gap:2px}.stat span.bar i{width:12px;height:7px;background:#2a3a3a;border-radius:2px}.stat span.bar i.f{background:var(--teal)}
.opts{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;align-items:center}
.opt{display:flex;gap:8px;align-items:center;font-size:16px}
.opt button{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-size:15px}
.opt button.sel{border-color:var(--teal);color:var(--teal)}
.wxprev{width:120px;height:70px;border-radius:12px;border:2px solid #000}
.keys{font-size:13px;opacity:.75;line-height:1.7}
.keys kbd{background:#1b2b2e;border:1px solid #3a5a5a;border-radius:5px;padding:1px 6px;font-family:inherit}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
#divider{position:fixed;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#000;z-index:6;display:none}
.hud{position:absolute;top:0;bottom:0;text-shadow:0 2px 3px #000,0 0 6px #000a;font-weight:800}
.hud .tl{position:absolute;left:18px;top:14px}
.hud .pos{font-size:44px;font-style:italic;line-height:1}.hud .pos b{color:var(--teal);font-size:62px}
.hud .lap{font-size:22px;margin-top:4px}
.hud .tr{position:absolute;right:18px;top:14px;text-align:right;line-height:1.3}
.hud .tr .cur{font-size:30px;font-variant-numeric:tabular-nums}
.hud .tr .t{font-size:17px;font-variant-numeric:tabular-nums}
.hud .tr .best{color:#c86bff}
.hud .bm{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);text-align:center;width:260px}
.hud .spd{font-size:62px;line-height:1;font-style:italic;font-variant-numeric:tabular-nums}
.hud .u{font-size:14px;opacity:.8;margin-top:-2px}
.hud .gear{position:absolute;right:-6px;bottom:30px;font-size:44px;color:var(--teal);font-style:italic}
.hud .rpm{height:10px;background:#0008;border:2px solid #000;border-radius:6px;margin-top:6px;overflow:hidden}
.hud .rpm i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fe67a,#ffe03b 70%,#ff3b3b)}
.hud canvas.mini{position:absolute;right:14px;bottom:14px;width:150px;height:150px;background:#0007;border-radius:14px;border:2px solid #fff3}
.hud .who{position:absolute;left:18px;bottom:16px;font-size:15px;background:#0009;border-left:6px solid var(--teal);padding:5px 12px;border-radius:6px}
.hud .msg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:34px;color:#ff5a5a}
.hud .tower{position:absolute;left:18px;top:112px;font-size:14px;line-height:1.5;background:#0007;border-radius:8px;padding:6px 10px;min-width:150px}
.hud .tower div{display:flex;gap:8px}.hud .tower div.me{color:var(--teal)}
.hud.two .pos{font-size:34px}.hud.two .pos b{font-size:48px}.hud.two .spd{font-size:46px}.hud.two .tr .cur{font-size:22px}.hud.two .tr .t{font-size:14px}
.hud.two canvas.mini{width:110px;height:110px}.hud.two .bm{width:190px}.hud.two .lap{font-size:18px}
#cd{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#cd.on{display:flex}
#cd .lights{display:flex;gap:18px;margin-bottom:14px}
#cd .lights i{width:46px;height:46px;border-radius:50%;background:#2a0b0b;border:4px solid #000;box-shadow:inset 0 0 8px #000}
#cd .lights i.on{background:#ff2a2a;box-shadow:0 0 24px #f22}
#cd .lights.go i{background:#25e05a;box-shadow:0 0 24px #2e6}
#cd .n{font-size:150px;font-weight:900;font-style:italic;text-shadow:0 6px 0 #000;line-height:1}
#radio{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:9;display:none;background:#0b1216ee;border:2px solid var(--teal);border-radius:10px;padding:8px 16px;font-size:15px;max-width:70%;text-align:center}
#radio b{color:var(--teal);font-size:12px;margin-right:10px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;background:#000a;padding:6px 16px;border-radius:10px;font-size:14px;display:none}
table{border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden;min-width:420px}
td,th{padding:8px 16px;border-bottom:1px solid #fff2;text-align:left;font-variant-numeric:tabular-nums}
th{background:#00d2be22;color:var(--teal)}
tr.human td{color:var(--teal);font-weight:800}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="divider"></div>
<div id="hud"></div>
<div id="cd"><div class="lights"><i></i><i></i><i></i><i></i><i></i></div><div class="n"></div></div>
<div id="toast"></div>

<div id="sc-title" class="screen on">
  <h1>AMG F1 <span>RACING</span></h1>
  <div class="sub">Mercedes-AMG Petronas · 5 circuits · 1P / 2P split-screen</div>
  <button class="big" id="btn-start">START</button>
  <div class="keys">P1 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> throttle · left · brake · right &nbsp;|&nbsp; P2 <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><br>Camera <kbd>C</kbd>(P1) <kbd>/</kbd>(P2) · Reset <kbd>R</kbd>(P1) <kbd>.</kbd>(P2) · Mute <kbd>M</kbd> · Pause <kbd>Esc</kbd></div>
</div>

<div id="sc-mode" class="screen">
  <h2>Select Players</h2>
  <div class="cards">
    <button class="card" data-mode="1"><span class="icon">🏎️</span><b>1 Player</b><small>Full screen · race vs AI<br>WASD or arrow keys</small></button>
    <button class="card" data-mode="2"><span class="icon">🏎️🏎️</span><b>2 Players</b><small>Local split-screen versus<br>P1 WASD · P2 arrow keys</small></button>
  </div>
  <button class="ghost back" data-to="sc-title">← Title</button>
</div>

<div id="sc-driver" class="screen">
  <h2 id="drv-title"></h2>
  <div class="cards" id="drv-cards"></div>
  <button class="ghost back" data-to="sc-mode">← Back</button>
</div>

<div id="sc-track" class="screen">
  <h2>Select Circuit</h2>
  <div class="cards" id="trk-cards"></div>
  <div style="display:flex;gap:14px"><button class="ghost back" data-to="sc-driver">← Back</button><button class="big" id="btn-trk-next">NEXT →</button></div>
</div>

<div id="sc-weather" class="screen">
  <h2>Select Weather</h2>
  <div class="cards" id="wx-cards"></div>
  <div class="opts"><div class="opt">Laps <span id="opt-laps"></span></div><div class="opt">AI Rivals <span id="opt-ai"></span></div></div>
  <div style="display:flex;gap:14px"><button class="ghost back" data-to="sc-track">← Back</button><button class="big" id="btn-go">START RACE</button></div>
</div>

<div id="sc-pause" class="screen" style="z-index:20">
  <h2>Paused</h2>
  <button class="big" id="btn-resume">Resume</button>
  <button class="ghost" id="btn-quit">Quit to Menu</button>
</div>

<div id="sc-result" class="screen" style="z-index:20">
  <h2>Race Results</h2>
  <div id="res-table"></div>
  <div style="display:flex;gap:14px"><button class="big" id="btn-again">Race Again</button><button class="ghost" id="btn-menu">Menu</button></div>
</div>

<script type="module">

 {name:'Silverstone Flow',sub:'NORTHAMPTONSHIRE · UK',desc:'Fast flowing sweepers and quick direction changes',sc:1.15,len:'5.9 km',pts:[[-250,0,0],[0,0,0],[220,-5,1],[360,-10,2],[440,30,2],[460,110,3],[430,180,3],[340,200,2],[270,170,2],[210,210,3],[220,290,4],[300,340,5],[400,350,5],[470,400,4],[470,480,3],[380,540,2],[250,560,2],[120,530,1],[0,470,1],[-100,500,0],[-200,520,0],[-300,470,0],[-340,380,0],[-320,260,0],[-370,170,0],[-340,70,0],[-300,15,0]]},

const N=900;
let flagUpdate=null,SC=1.4,P,TAN,RIGHT,PSI,SL,L,DS,minX,maxX,minZ,maxZ,cx0,cz0,lampHeads,world=null,roadMat,pitMat,groundMat,curTrack=-1;
const HALF=8,CURB=9.3,WALL=15.5,WALL_C=13.6;

function radioSay(text,key,cool=0,prio=0){
  if(phase==='menu')return;

  if(key){if(radioCool[key]&&now<radioCool[key])return;radioCool[key]=now+cool*1000}

  if(!ac)return;const t=ac.currentTime;

  radioBusy=true;radioEl.innerHTML=`<b>📻 TEAM RADIO</b><span>${text}</span>`;radioEl.style.display='block';squelch(true);
  let fin=false;
  const done=()=>{if(fin)return;fin=true;squelch(false);radioEl.style.display='none';setTimeout(()=>{radioBusy=false;const n=radioQ.shift();if(n&&phase!=='menu')radioPlay(n.text)},400)};

      const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=1.08;u.pitch=.85;u.volume=.9;
      const vs=speechSynthesis.getVoices();const vv=vs.find(x=>/en-GB/i.test(x.lang)&&/male|daniel|oliver|arthur/i.test(x.name))||vs.find(x=>/^en/i.test(x.lang));if(vv)u.voice=vv;

function nearest(c){

  let hint=Math.round(c.si),best=1e18,bi=hint;

  const dx=c.x-P[bi].x,dz=c.z-P[bi].z,T=TAN[bi],R=RIGHT[bi];
  const along=dx*T.x+dz*T.z;
  c.i=bi;c.si=((bi+along/DS)%N+N)%N;c.lat=dx*R.x+dz*R.z;c.ty=P[bi].y+SL[bi]*along;c.sl=SL[bi];
}
function placeOnTrack(c,si,lat){
  const i=((Math.round(si)%N)+N)%N,r=RIGHT[i];

function buildProfile(gm){
  const k=new Float32Array(N);
  for(let i=0;i<N;i++){const a=PSI[(i+N-2)%N],b=PSI[(i+2)%N];k[i]=Math.abs(wrapAng(b-a))/(4*DS)}
  const ks=new Float32Array(N);for(let i=0;i<N;i++){let s=0;for(let j=-4;j<=4;j++)s+=k[(i+j+N)%N];ks[i]=s/9}

  const b=36*Math.min(1,gm+.12);
  for(let it=0;it<3;it++)for(let i=N-1;i>=0;i--)v[i]=Math.min(v[i],Math.sqrt(v[(i+1)%N]**2+2*b*DS));

}

function humanInput(c,dt){
  const p=c.p;let thr,brk,l,r;
  if(cfg.mode===1){thr=keys.KeyW||keys.ArrowUp;brk=keys.KeyS||keys.ArrowDown;l=keys.KeyA||keys.ArrowLeft;r=keys.KeyD||keys.ArrowRight}
  else if(p===0){thr=keys.KeyW;brk=keys.KeyS;l=keys.KeyA;r=keys.KeyD}
  else{thr=keys.ArrowUp;brk=keys.ArrowDown;l=keys.ArrowLeft;r=keys.ArrowRight}
  const tgt=(r?1:0)-(l?1:0);
  c.steer+=(tgt-c.steer)*Math.min(1,dt*(tgt===0?10:6.5));
  return {thr:thr?1:0,brk:brk?1:0,steer:c.steer};
}
function aiInput(c,dt,cruise=1){
  const ahead=10+Math.abs(c.vf)*.42;
  const ti=(c.si+ahead/DS)%N,i0=Math.floor(ti),i1=(i0+1)%N,f=ti-i0;
  const tx=lerp(P[i0].x,P[i1].x,f),tz=lerp(P[i0].z,P[i1].z,f),r=RIGHT[i0];
  const lane=clamp(c.lane,-5,5);
  const gx=tx+r.x*lane,gz=tz+r.z*lane;
  const want=Math.atan2(gx-c.x,gz-c.z),err=wrapAng(want-c.psi);
  const tgt=clamp(-err*2.6,-1,1);
  c.steer+=(tgt-c.steer)*Math.min(1,dt*8);
  const vt=profile[(Math.round(c.si)+3)%N]*c.skill*cruise*(c.onGrass?.6:1);
  let thr=0,brk=0;
  if(c.vf>vt+1.5)brk=clamp((c.vf-vt)/8,.2,1);else thr=clamp((vt-c.vf)/6+.3,0,1);
  return {thr,brk,steer:c.steer};
}

/* ================= 물리 ================= */
function stepCar(c,inp,dt){
  const gm=wx.grip*(c.onGrass?.55:1)*c.stats.grip;
  const sp=Math.abs(c.vf);
  let w=inp.steer*2.3*Math.min(1,sp/9)/(1+(sp/48)**2);
  const lim=(LAT*gm*(1+.0035*sp))/Math.max(sp,1);
  if(Math.abs(w)>lim){c.slip=Math.abs(w)-lim;w=Math.sign(w)*lim}else c.slip*=.85;
  if(c.vf<0)w=-w;
  c.psi-=w*dt;
  const fx=Math.sin(c.psi),fz=Math.cos(c.psi),rx=-fz,rz=fx;
  let vf=c.vx*fx+c.vz*fz,vl=c.vx*rx+c.vz*rz;
  const top=VMAX*c.stats.top*(c.onGrass?.55:1);
  let a=0;
  if(inp.thr>0){const k=Math.max(0,1-Math.pow(Math.max(vf,0)/top,2.2));a+=ACC*c.stats.acc*k*Math.min(1,gm+.2);if(vf<-1)a+=BRAKE*.5}
  if(inp.brk>0){if(vf>1)a-=BRAKE*Math.min(1,gm+.12);else a-=9}
  if(inp.thr===0&&inp.brk===0&&Math.abs(vf)>.2)a-=Math.sign(vf)*(1.5+.05*Math.abs(vf));
  a-=.0004*vf*Math.abs(vf);
  if(c.onGrass)a-=vf*.45;
  a-=9.81*c.sl*.5;
  a-=c.slip*sp*.3;
  if(vf>top&&inp.thr>0)a-=(vf-top)*1.5;
  vf+=a*dt;if(vf<-12)vf=-12;
  vl*=Math.exp(-dt*(6.5*gm+1));
  c.vx=fx*vf+rx*vl;c.vz=fz*vf+rz*vl;c.vf=vf;c.vl=vl;c.acc=a;
  c.x+=c.vx*dt;c.z+=c.vz*dt;
  c.speed=Math.hypot(c.vx,c.vz);
  nearest(c);
  const al=Math.abs(c.lat);
  c.onGrass=al>CURB;
  // 벽 충돌
  if(al>WALL_C){
    const sg=Math.sign(c.lat),R=RIGHT[c.i],over=al-WALL_C;
    c.x-=R.x*sg*over;c.z-=R.z*sg*over;
    const vn=c.vx*R.x*sg+c.vz*R.z*sg;
    if(vn>0){
      c.vx-=R.x*sg*vn*1.3;c.vz-=R.z*sg*vn*1.3;
      const f=1-clamp(vn/Math.max(c.speed,5),0,1)*.35;c.vx*=f;c.vz*=f;
      c.psi+=wrapAng(PSI[c.i]-c.psi)*.12;
      if(vn>3){c.shake=Math.min(1,vn/20);if(c.human&&c.eng)thud(vn);if(c.human&&vn>14)radioFor(c,'Are you OK? Talk to me.','crash',25,1)}
    }
    nearest(c);
  }
  c.wrongWay=c.speed>6&&(c.vx*TAN[c.i].x+c.vz*TAN[c.i].z)<-.4*c.speed;
}
function collide(){
  for(let a=0;a<cars.length;a++)for(let b=a+1;b<cars.length;b++){
    const A=cars[a],B=cars[b];const dx=B.x-A.x,dz=B.z-A.z;const d=Math.hypot(dx,dz);
    if(d<2.6&&d>.001){
      const nx=dx/d,nz=dz/d,ov=2.6-d;
      A.x-=nx*ov/2;A.z-=nz*ov/2;B.x+=nx*ov/2;B.z+=nz*ov/2;
      const rv=(B.vx-A.vx)*nx+(B.vz-A.vz)*nz;
      if(rv<0){const j=-rv*.6;A.vx-=nx*j;A.vz-=nz*j;B.vx+=nx*j;B.vz+=nz*j;A.vx*=.99;A.vz*=.99;B.vx*=.99;B.vz*=.99;
        if(-rv>3){A.shake=B.shake=Math.max(A.shake,.5);if((A.human||B.human)&&ac)thud(-rv*2)}}
    }
  }
}
function updateLaps(c){
  const s=c.si;
  if(c.prevS>N*.75&&s<N*.25){
    c.lapsDone++;
    if(c.lapsDone===0)c.lapStart=raceTime;
    else{c.last=raceTime-c.lapStart;if(c.best==null||c.last<c.best)c.best=c.last;c.lapStart=raceTime;
      if(c.human)toast(`${c.name} Lap ${c.lapsDone}  ${fmt(c.last)}`+(c.last===c.best?' ★ Best':''))}
    if(c.lapsDone>=cfg.laps&&!c.finished){c.finished=true;c.finishTime=raceTime;c.finishOrder=cars.filter(x=>x.finished).length}
    lapRadio(c);
  }else if(c.prevS<N*.25&&s>N*.75)c.lapsDone--;
  c.prevS=s;
  c.total=c.finished?1e6-c.finishTime:c.lapsDone*N+s;
}

const tmpV=new THREE.Vector3();
function updateCam(cam,c,dt){
  const u=cam.userData;
  if(!u.init){u.ang=c.psi;u.init=true}
  u.ang+=wrapAng(c.psi-u.ang)*Math.min(1,dt*(u.mode===2?30:6));
  const fx=Math.sin(u.ang),fz=Math.cos(u.ang);
  let dist=[9.5,17,0][u.mode],hgt=[3.6,6.5,1.5][u.mode];
  let px=c.x-fx*dist,pz=c.z-fz*dist,py=c.y+hgt;
  const sh=c.shake*.25+(c.onGrass?c.speed*.002:0);
  if(u.mode===2){px=c.x+fx*.3;pz=c.z+fz*.3}
  if(!u.pos)u.pos=new THREE.Vector3(px,py,pz);
  const k=u.mode===2?1:1-Math.exp(-dt*12);
  u.pos.x+=(px-u.pos.x)*k;u.pos.y+=(py-u.pos.y)*k;u.pos.z+=(pz-u.pos.z)*k;
  cam.position.set(u.pos.x+rnd(-sh,sh),u.pos.y+rnd(-sh,sh),u.pos.z+rnd(-sh,sh));
  cam.lookAt(c.x+fx*(u.mode===2?30:6),c.y+(u.mode===2?1.2:1.2),c.z+fz*(u.mode===2?30:6));
  const tf=62+Math.min(c.speed,90)*.18;cam.fov+=(tf-cam.fov)*.1;
}

  g.strokeStyle='#000';g.lineWidth=15;path();g.stroke();g.strokeStyle='#cfd8dc';g.lineWidth=9;path();g.stroke();
  g.fillStyle='#fff';const s=P[0];g.fillRect(s.x*mmS+mmX-9,s.z*mmS+mmY-3,18,6);

}
function gearOf(v){const tops=[22,38,52,64,74,82,88,999];for(let i=0;i<8;i++)if(v<tops[i])return i+1;return 8}
function rpmOf(v,g){const tops=[0,22,38,52,64,74,82,88,96],lo=tops[g-1],hi=tops[g];return clamp(.42+.58*(v-lo)/(hi-lo),.3,1)}
function updateHud(){

function audioUpdate(){
  if(!ac)return;
  if(ambience)ambience.g.gain.setTargetAtTime(phase==='menu'?0:.03,ac.currentTime,.3);
  for(const c of cars){
    const v=c.voice;if(!v)continue;
    if(c.human){updateVoice(v,c,{vol:1});continue}
    let best=null,bd=1e9;for(const h of humans){const d=Math.hypot(c.x-h.x,c.z-h.z);if(d<bd){bd=d;best=h}}
    if(!best)continue;
    const u=cams[humans.indexOf(best)].userData,rx=-Math.cos(u.ang),rz=Math.sin(u.ang);
    const dx=c.x-best.x,dz=c.z-best.z,d=Math.max(bd,1);
    const away=((c.vx-best.vx)*dx+(c.vz-best.vz)*dz)/d;
    updateVoice(v,c,{vol:bd>320?0:.8/Math.pow(1+d/16,1.25),pan:clamp((dx*rx+dz*rz)/d,-1,1)*.85,dop:343/(343+away)});
  }
}

function tick(now){
  let dt=clamp((now-last)/1000,0.001,1/20);last=now;
  const W=innerWidth,H=innerHeight;
  if(renderer.domElement.width!==Math.floor(W*renderer.getPixelRatio())){renderer.setSize(W,H,false)}
  if(phase==='menu'){
    showCars.forEach(c=>{c.group.rotation.y+=dt*.5*c.group.userData.spin;c.wheels.fl.spin.rotation.x+=dt*2});
    showCam.aspect=W/H;showCam.updateProjectionMatrix();

  }

        $('#cd .n').textContent=st>0?st:'GO!';

      for(const c of humans){const i=humanInput(c,dt);c.thr=i.thr}
    }

          c.thr=inp.thr;c.brk=inp.brk;
          stepCar(c,inp,dt/sub);
        }

      }
      for(const c of cars)updateLaps(c);
      [...cars].sort((a,b)=>b.total-a.total).forEach((c,i)=>c.rank=i+1);
      for(const h of humans){
        if(h.prevRank&&h.rank<h.prevRank&&raceTime>8)radioFor(h,`Good job. P${h.rank}.`,'pos',12);h.prevRank=h.rank;
        h.grassT=h.onGrass?(h.grassT||0)+dt:0;if(h.grassT>1.6)radioFor(h,'Watch track limits. Keep it on the tarmac.','grass',25);
        h.wrongT=h.wrongWay?(h.wrongT||0)+dt:0;if(h.wrongT>1.2)radioFor(h,"You're facing the wrong way. Turn around!",'wrong',15,1);
      }

      const ty=al<CURB+.2?c.ty+.02:groundH(al,c.ty,c.x,c.z)+.02;
      c.y+=(ty-c.y)*Math.min(1,dt*18);
      c.pitch+=(-Math.atan(c.sl)-c.pitch)*Math.min(1,dt*8);
      c.group.position.set(c.x,c.y,c.z);
      c.group.rotation.y=c.psi;c.group.rotation.x=c.pitch-clamp(c.acc,-30,20)*.0012;
      c.group.rotation.z=-c.steer*c.speed*.0004;
      const W=c.model.wheels;c.wheelSpin+=c.vf*dt/.37;
      for(const k in W){W[k].spin.rotation.x=c.wheelSpin;if(W[k].front)W[k].piv.rotation.y=-c.steer*.4}
      c.shake*=Math.pow(.02,dt);
      if(c.speed>22&&(c.slip>.12||(c.brk>0&&c.speed>55))&&Math.random()<dt*40){const fx=Math.sin(c.psi),fz=Math.cos(c.psi);
        for(const s of[-1,1])emit(c.x-fx*1.6-fz*s*.9,c.y+.2,c.z-fz*1.6+fx*s*.9,rnd(-1,1)+c.vx*.7,rnd(.3,1.2),rnd(-1,1)+c.vz*.7,[.92,.92,.92],rnd(.5,1))}

  }

    renderer.render(scene,cam);
  }
}
